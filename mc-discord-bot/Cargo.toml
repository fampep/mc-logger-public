[package]
name = "mc-discord-bot"
version = "1.0.0"
edition = "2021"
description = "Discord bridge and stats for the Minecraft chat logger database"

# One-shot HTTP exporter (no gateway): cargo build --release --bin discord-scrape

[dependencies]
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = [
    "builder",
    "cache",
    "chrono",
    "client",
    "gateway",
    "model",
    "http",
    "utils",
    "collector",
    "framework",
    "rustls_backend",
] }
tokio = { version = "1", features = ["full"] }
# Already in the tree via serenity; used directly for Mojang name lookups.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4", "with-serde_json-1"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
futures = "0.3"
parking_lot = "0.12"
rand = "0.8"
mc-stream = { path = "../mc-stream" }
