[package]
name = "mc-stream"
version = "0.1.0"
edition = "2021"
description = "Shared JSONL protocol for per-server Minecraft event streams"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "macros", "rt"] }
tracing = "0.1"
